<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustScore | Enterprise DPDP Compliance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <i class="fas fa-shield-halved text-indigo-600 text-2xl"></i>
            <span class="text-xl font-bold text-slate-800">TrustScore</span>
            <span class="text-xs font-medium text-slate-400 uppercase tracking-widest ml-2">Enterprise DPDP</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-4">Audit Any Website for DPDP Compliance</h1>
            <p class="text-lg text-slate-600">Instantly scan privacy policies, cookie banners, and legal officers under the 2023 Act.</p>
        </div>

        <div class="glass-card p-2 rounded-2xl shadow-xl flex mb-12 border border-slate-200">
            <input type="text" id="urlInput" placeholder="https://example.com" 
                class="flex-1 px-6 py-4 rounded-xl text-lg outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <button onclick="runAudit()" id="auditBtn" class="gradient-bg text-white px-8 py-4 rounded-xl font-bold hover:opacity-90 transition-all flex items-center">
                <span>Run Audit</span>
            </button>
        </div>

        <div id="loading" class="hidden text-center py-12">
            <div class="animate-spin text-indigo-600 text-4xl mb-4"><i class="fas fa-circle-notch"></i></div>
            <p class="text-slate-500 font-medium">Analyzing legal compliance structure...</p>
        </div>

        <div id="errorBox" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded mb-8">
            <p id="errorMessage" class="text-red-700"></p>
        </div>

        <div id="results" class="hidden space-y-8">
            <div class="glass-card p-8 rounded-3xl shadow-lg border border-slate-200 text-center">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Compliance Score</h2>
                <div id="scoreDisplay" class="text-7xl font-black text-indigo-600 mb-2">0/100</div>
                <div id="riskLevel" class="inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider">MODERATE RISK</div>
            </div>

            <div id="detailsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </div>
    </main>

    <script>
        // --- FOUNDER SETTINGS ---
        const myWhatsApp = "917393849303"; 
        const myUPI = "7393849303@fampay"; // Make sure this is your real FamPay ID
        const SECRET_KEY = "DPDP-PRO-2026"; 

        // --- CHECK IF USER HAS 30-DAY PREMIUM ---
        function checkPremiumStatus() {
            const expiry = localStorage.getItem('trustscore_premium_expiry');
            if (expiry && new Date().getTime() < parseInt(expiry)) {
                return true;
            }
            return false;
        }

        // --- THE LICENSE KEY ACTIVATOR ---
        function activateLicense() {
            const userInput = prompt("Enter your 30-Day License Key (Contact Support on WhatsApp to purchase):");
            if (userInput === SECRET_KEY) {
                const thirtyDays = 30 * 24 * 60 * 60 * 1000;
                const expiryTime = new Date().getTime() + thirtyDays;
                localStorage.setItem('trustscore_premium_expiry', expiryTime);
                alert("SUCCESS! 🚀 Premium Access Unlocked for 30 Days. Please Re-Run the Audit to see your legal solutions.");
            } else if (userInput) {
                alert("❌ Invalid License Key. Please try again or contact support.");
            }
        }

        // --- THE PAYWALL UNLOCK FUNCTION WITH DIRECT UPI ---
        function unlockFix(checkName) {
            const message = `Hi Abhishek, I am ready to pay ₹30,500 for the 30-Day License Key to unlock the DPDP fixes for ${checkName}.`;
            const whatsappUrl = `https://wa.me/${myWhatsApp}?text=${encodeURIComponent(message)}`;
            
            const confirmPay = confirm(`PREMIUM FEATURE\n\nTo unlock the specific legal code and implementation guide for "${checkName}", you need a 30-Day License Key (₹9,999).\n\nClick OK to open your UPI app and pay, then send the screenshot to WhatsApp to get your key.`);
            
            if(confirmPay) {
                const upiLink = `upi://pay?pa=${myUPI}&pn=TrustScore%20Premium&am=9999&cu=INR&tn=License%20Key`;
                window.location.href = upiLink;
                
                setTimeout(() => {
                    const goWa = confirm(`If your payment app didn't open automatically, send ₹9,999 to:\n${myUPI}\n\nClick OK to open WhatsApp and send the payment screenshot to get your License Key.`);
                    if(goWa) window.open(whatsappUrl, '_blank');
                }, 1500);
            }
        }

        async function runAudit() {
            const urlInput = document.getElementById('urlInput').value;
            const btn = document.getElementById('auditBtn');
            const results = document.getElementById('results');
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('errorBox');

            if (!urlInput) return alert("Please enter a URL");

            results.classList.add('hidden');
            errorBox.classList.add('hidden');
            loading.classList.remove('hidden');
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_url: urlInput })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Audit failed");

                document.getElementById('scoreDisplay').innerText = `${data.report.trust_score.score}/100`;
                const risk = data.report.trust_score.risk_level;
                const riskEl = document.getElementById('riskLevel');
                riskEl.innerText = risk;
                riskEl.className = `inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${risk === 'LOW RISK' ? 'bg-green-100 text-green-700' : risk === 'MODERATE RISK' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`;

                const grid = document.getElementById('detailsGrid');
                grid.innerHTML = '';
                
                const isPremium = checkPremiumStatus();

                data.report.detailed_analysis.forEach(item => {
                    const card = document.createElement('div');
                    // Flex column and mt-auto ensures the buttons stay at the bottom
                    card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col";
                    
                    const isLocked = item.status !== 'Pass' && !isPremium;
                    const safeCheck = item.check.replace(/'/g, "\\'");

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-slate-800">${item.check}</h3>
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${item.status === 'Pass' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">${item.status}</span>
                        </div>
                        
                        <p class="text-sm text-slate-600 mb-6 leading-relaxed">${item.solution}</p>
                        
                        <div class="mt-auto">
                            ${isLocked ? `
                                <div class="flex flex-col space-y-2">
                                    <button onclick="unlockFix('${safeCheck}')" 
                                         class="w-full py-3 bg-indigo-600 text-white text-[12px] font-bold rounded-lg text-center shadow-md hover:bg-indigo-700 transition-all uppercase tracking-widest border border-indigo-700">
                                         <i class="fas fa-lock mr-2"></i> Unlock Fix (₹9,999)
                                    </button>
                                    <button onclick="activateLicense()" 
                                         class="w-full py-2 bg-slate-100 text-slate-600 text-[10px] font-bold rounded-lg text-center hover:bg-slate-200 transition-all uppercase tracking-widest">
                                         <i class="fas fa-key mr-1"></i> I have a License Key
                                    </button>
                                </div>` : item.status !== 'Pass' ? `
                                <div class="text-[11px] font-bold text-indigo-600 uppercase tracking-tight p-3 bg-indigo-50 rounded text-center border border-indigo-100">
                                     <i class="fas fa-unlock mr-1"></i> Premium Unlocked
                                </div>` : `
                                <div class="text-[11px] font-bold text-green-600 uppercase tracking-tight p-3 bg-green-50 rounded text-center border border-green-100">
                                     <i class="fas fa-check-circle mr-1"></i> Compliant
                                </div>`}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                results.classList.remove('hidden');
            } catch (err) {
                document.getElementById('errorMessage').innerText = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
